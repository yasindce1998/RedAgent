[advisories]
yanked = "warn"

[licenses]
# Only permissive / weak-copyleft licenses used by the dependency graph.
# GPL/AGPL are intentionally absent and therefore denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
    "ISC",
    "BSL-1.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "LGPL-2.1-or-later",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
