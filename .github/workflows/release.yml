name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: redagent_0.2.0_linux_amd64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: redagent_0.2.0_darwin_amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: redagent_0.2.0_darwin_arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: redagent_0.2.0_windows_amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p redagent-cli
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/redagent_0.2.0
          cp target/${{ matrix.target }}/release/redagent dist/redagent_0.2.0/
          cp LICENSE README.md dist/redagent_0.2.0/
          tar czf ${{ matrix.asset }} -C dist redagent_0.2.0
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/redagent_0.2.0 | Out-Null
          Copy-Item target/${{ matrix.target }}/release/redagent.exe dist/redagent_0.2.0/
          Copy-Item LICENSE, README.md dist/redagent_0.2.0/
          Compress-Archive -Path dist/redagent_0.2.0 -DestinationPath ${{ matrix.asset }}
      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum redagent_* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RedAgent v0.2.0" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
