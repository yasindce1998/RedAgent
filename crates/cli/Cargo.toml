[package]
name = "redagent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "redagent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
redagent-app = { path = "../app" }
redagent-api = { path = "../api" }
redagent-core = { path = "../core" }
redagent-export = { path = "../export" }
redagent-scope = { path = "../scope" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
