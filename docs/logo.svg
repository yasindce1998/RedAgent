<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RedAgent logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d5e"/>
      <stop offset="0.55" stop-color="#e11d38"/>
      <stop offset="1" stop-color="#8b0d20"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2d45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d45" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)" filter="url(#soft)"/>

  <!-- shield -->
  <path d="M256 82 406 167 406 345 256 430 106 345 106 167Z"
        fill="#0d1322" stroke="url(#red)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 116 375 185 375 327 256 396 137 327 137 185Z"
        fill="none" stroke="#ff5b6c" stroke-opacity="0.35" stroke-width="3"/>

  <!-- agent network: nodes + links -->
  <g stroke="#ff5b6c" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="256" y2="166"/>
    <line x1="256" y1="256" x2="334" y2="211"/>
    <line x1="256" y1="256" x2="334" y2="301"/>
    <line x1="256" y1="256" x2="256" y2="346"/>
    <line x1="256" y1="256" x2="178" y2="301"/>
    <line x1="256" y1="256" x2="178" y2="211"/>
  </g>
  <g fill="#0d1322" stroke="#ff7180" stroke-width="5">
    <circle cx="256" cy="166" r="10"/>
    <circle cx="334" cy="211" r="10"/>
    <circle cx="334" cy="301" r="10"/>
    <circle cx="256" cy="346" r="10"/>
    <circle cx="178" cy="301" r="10"/>
    <circle cx="178" cy="211" r="10"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="34" fill="url(#red)"/>
  <circle cx="256" cy="256" r="44" fill="none" stroke="#ff8b96" stroke-opacity="0.45" stroke-width="3"/>
  <!-- forward chevron -->
  <path d="M242 234 270 256 242 278" fill="none" stroke="#fff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
